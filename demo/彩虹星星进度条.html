<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彩虹星星进度条 - 同步填充版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f0f0f5;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .phone-frame {
    width: 375px;
    height: 667px;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    position: relative;
  }
  .bg-image {
    position: absolute;
    inset: 0;
    background-image: url('../assets/03_等待界面/10_骑飞马飞翔.png');
    background-size: cover;
    background-position: center;
  }

  .progress-area {
    position: absolute;
    bottom: 50px;
    left: 30px;
    right: 30px;
    z-index: 20;
  }
  .loading-text {
    text-align: center;
    font-size: 15px;
    color: #5B7BB8;
    font-weight: 500;
    margin-bottom: 14px;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
  }

  /* 进度条轨道：透明背景，只有细边框轮廓 */
  .progress-track {
    width: 100%;
    height: 20px;
    border-radius: 10px;
    background: transparent;
    border: 2px solid rgba(255,255,255,0.7);
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    position: relative;
    overflow: visible;
  }

  /* 彩虹填充层：鲜艳饱和的彩虹色 */
  .rainbow-fill {
    height: 100%;
    border-radius: 8px;
    background: linear-gradient(90deg,
      #FF6B9D 0%,
      #FFA552 25%,
      #FFD93D 50%,
      #6BCB77 75%,
      #4D96FF 100%);
    box-shadow: 0 0 10px rgba(255,107,157,0.6);
    animation: fillProgress 3s ease-in-out infinite;
  }

  /* 填充动画：从0到100%，3秒一圈 */
  @keyframes fillProgress {
    0%   { width: 0%; }
    90%  { width: 100%; }
    100% { width: 100%; }
  }

  /* 星星在填充的最前端，和填充同步移动 */
  .running-star {
    position: absolute;
    top: 50%;
    width: 28px;
    height: 28px;
    margin-top: -14px;
    z-index: 2;
    filter: drop-shadow(0 0 6px #FFD93D) drop-shadow(0 0 12px rgba(255,217,61,0.7));
    animation: starRun 3s ease-in-out infinite;
  }
  .running-star svg {
    width: 100%;
    height: 100%;
  }

  /* 星星位置和填充宽度完全同步 */
  @keyframes starRun {
    0%   { left: 0%; transform: translateX(-50%) scale(0.9) rotate(0deg); }
    90%  { left: 100%; transform: translateX(-50%) scale(1.15) rotate(360deg); }
    100% { left: 100%; transform: translateX(-50%) scale(1.15) rotate(360deg); }
  }

  /* 星星到达终点时闪一下，表示完成，然后重新开始 */
  .running-star {
    animation: starRun 3s ease-in-out infinite, starGlow 0.3s ease-in-out 2.7s infinite alternate;
  }
  @keyframes starGlow {
    from { filter: drop-shadow(0 0 6px #FFD93D); }
    to   { filter: drop-shadow(0 0 14px #FFD93D) drop-shadow(0 0 20px #FFA500); }
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="bg-image"></div>

    <div class="progress-area">
      <div class="loading-text">AI 正在出题中...</div>
      <div class="progress-track">
        <div class="rainbow-fill"></div>
        <div class="running-star">
          <svg viewBox="0 0 24 24">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
                  fill="#FFD93D" stroke="#F0B820" stroke-width="1"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
