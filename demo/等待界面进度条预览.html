<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f0f5;
    padding: 30px;
  }
  h1 {
    text-align: center;
    color: #7B5EA7;
    margin-bottom: 10px;
    font-size: 22px;
  }
  .subtitle {
    text-align: center;
    color: #9B7FC7;
    margin-bottom: 30px;
    font-size: 14px;
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .preview-item {
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    background: white;
  }
  .phone-screen {
    width: 100%;
    aspect-ratio: 3/4;
    position: relative;
    overflow: hidden;
  }
  .phone-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* 进度条叠加层 */
  .progress-overlay {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
  }
  .loading-text {
    text-align: center;
    font-size: 12px;
    color: #5B7BB8;
    font-weight: 500;
    margin-bottom: 10px;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
  }
  .progress-track {
    width: 100%;
    height: 12px;
    border-radius: 6px;
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.7);
    position: relative;
  }
  .rainbow-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #FF6B9D, #FFA552, #FFD93D, #6BCB77, #4D96FF);
    box-shadow: 0 0 6px rgba(255,107,157,0.6);
    animation: fillProgress 3s ease-in-out infinite;
  }
  @keyframes fillProgress {
    0%   { width: 0%; }
    90%  { width: 100%; }
    100% { width: 100%; }
  }
  .running-star {
    position: absolute;
    top: 50%;
    width: 16px;
    height: 16px;
    margin-top: -8px;
    filter: drop-shadow(0 0 3px #FFD93D);
    animation: starRun 3s ease-in-out infinite;
  }
  .running-star::before {
    content: '★';
    color: #FFD93D;
    font-size: 16px;
    line-height: 16px;
  }
  @keyframes starRun {
    0%   { left: 0%; transform: translateX(-50%); }
    90%  { left: 100%; transform: translateX(-50%); }
    100% { left: 100%; transform: translateX(-50%); }
  }

  .img-label {
    padding: 10px;
    text-align: center;
    font-size: 12px;
    color: #666;
    background: white;
  }
</style>
