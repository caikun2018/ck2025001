<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>等待界面路径动画测试 - 彩虹上的星星</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f0f0f5;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .phone-frame {
    width: 375px;
    height: 667px;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    position: relative;
  }
  .bg-image {
    position: absolute;
    inset: 0;
    background-image: url('../assets/03_等待界面/10_骑飞马飞翔.png');
    background-size: cover;
    background-position: center;
  }

  /* 沿彩虹移动的星星 —— 和原图风格一致的圆润黄色五角星 */
  .flying-star {
    position: absolute;
    width: 48px;
    height: 48px;
    z-index: 10;
    /* 发光效果，像原图上的星星一样柔和 */
    filter: drop-shadow(0 0 6px rgba(255, 220, 100, 0.9)) 
            drop-shadow(0 0 14px rgba(255, 200, 50, 0.6));
    animation: starRideRainbow 3.5s ease-in-out infinite;
  }
  .flying-star svg {
    width: 100%;
    height: 100%;
  }

  /*
   * 彩虹弧线坐标（基于实际图片比例）：
   * 彩虹左端：约 left: 14%, top: 22%
   * 彩虹顶端：约 left: 50%, top: 6%
   * 彩虹右端：约 left: 90%, top: 26%
   * 星星沿着这个半圆弧线从左滑到右
   */
  @keyframes starRideRainbow {
    0% {
      left: 14%;
      top: 22%;
      transform: scale(0.9) rotate(0deg);
      opacity: 0;
    }
    8% {
      opacity: 1;
      transform: scale(1) rotate(10deg);
    }
    25% {
      left: 28%;
      top: 12%;
      transform: scale(1.05) rotate(45deg);
    }
    50% {
      left: 50%;
      top: 6%;
      transform: scale(1.15) rotate(90deg);
    }
    75% {
      left: 72%;
      top: 12%;
      transform: scale(1.05) rotate(135deg);
    }
    92% {
      opacity: 1;
      transform: scale(1) rotate(170deg);
    }
    100% {
      left: 90%;
      top: 26%;
      transform: scale(0.9) rotate(180deg);
      opacity: 0;
    }
  }

  /* 星星后面的小光点拖尾 */
  .sparkle {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle, #FFF5CC 0%, rgba(255,230,150,0.6) 40%, transparent 70%);
    z-index: 9;
    pointer-events: none;
  }
  .sparkle:nth-of-type(1) { animation: trail1 3.5s ease-in-out infinite; }
  .sparkle:nth-of-type(2) { animation: trail2 3.5s ease-in-out infinite; }
  .sparkle:nth-of-type(3) { animation: trail3 3.5s ease-in-out infinite; }

  @keyframes trail1 {
    0%, 100% { left: 14%; top: 22%; opacity: 0; }
    10% { opacity: 0.8; }
    50% { left: 46%; top: 8%; opacity: 0.6; }
    90% { opacity: 0.3; }
  }
  @keyframes trail2 {
    0%, 100% { left: 14%; top: 22%; opacity: 0; }
    15% { opacity: 0.7; }
    50% { left: 42%; top: 9%; opacity: 0.5; }
    85% { opacity: 0.2; }
  }
  @keyframes trail3 {
    0%, 100% { left: 14%; top: 22%; opacity: 0; }
    20% { opacity: 0.6; }
    50% { left: 38%; top: 11%; opacity: 0.4; }
    80% { opacity: 0.1; }
  }

  /* 底部加载文字 */
  .loading-text {
    position: absolute;
    bottom: 50px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 15px;
    color: #5B7BB8;
    font-weight: 500;
    letter-spacing: 1px;
    z-index: 20;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="bg-image"></div>

    <!-- 拖尾光点 -->
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>

    <!-- 沿彩虹飞行的星星（圆润黄色五角星，和原图风格一致） -->
    <div class="flying-star">
      <svg viewBox="0 0 100 100">
        <!-- 圆润风格的五角星，和原图上的星星造型匹配 -->
        <path d="M50 8 L61 38 L94 38 L67 58 L77 90 L50 70 L23 90 L33 58 L6 38 L39 38 Z"
              fill="#FFD93D" stroke="#F0B820" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="loading-text">AI 正在出题中...</div>
  </div>
</body>
</html>
